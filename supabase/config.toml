# Local Supabase stack for development on one machine.
#
# `supabase start` reads this, brings up PostgreSQL, PostgREST, GoTrue (Auth),
# Storage and Studio in Docker, applies every file in ./migrations in order, and
# then runs the seed files listed under [db.seed].
#
# Because the CLI owns the schema here, do NOT also run `npm run db:migrate` or
# `npm run db:seed` against this database. Those scripts keep their own ledger
# (public.schema_migrations) and would try to apply the same migrations a second
# time, which fails: the migrations use plain `create table`, not `create table
# if not exists`. See docs/LOCAL-SETUP-MACOS.md.
#
# The hosted project is unaffected by anything in this file.

project_id = "guzar-garden"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# Order matters: seed_menu.sql looks the venue up by slug, so the venue has to
# exist first. Same order as scripts/db-seed.mjs uses.
sql_paths = ["./seed.sql", "./seed_menu.sql"]

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

[storage]
enabled = true
# Matches MAX_MENU_IMAGE_BYTES (8 MiB) with room for the multipart envelope.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Staff accounts are created by an admin with scripts/create-admin.mjs, never by
# self-service signup — the same posture as the hosted project.
enable_signup = false

[auth.email]
enable_signup = false
# Local only: no real mailbox is involved, so a staff account created by the
# script is usable immediately instead of waiting on a confirmation link.
enable_confirmations = false

[inbucket]
enabled = true
port = 54324
